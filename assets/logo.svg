<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="RAWimp">
  <defs>
    <linearGradient id="riBarrel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39465A"/>
      <stop offset="1" stop-color="#151A22"/>
    </linearGradient>
    <radialGradient id="riGlass" cx="0.35" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#1B2430"/>
      <stop offset="1" stop-color="#0A0E14"/>
    </radialGradient>
    <linearGradient id="riSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC94B"/>
      <stop offset="1" stop-color="#F08A20"/>
    </linearGradient>
  </defs>

  <!-- lens barrel -->
  <circle cx="32" cy="32" r="31" fill="url(#riBarrel)"/>
  <!-- front element -->
  <circle cx="32" cy="32" r="25.5" fill="url(#riGlass)"/>
  <!-- coating rim -->
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#F5A524" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- imp -->
  <g fill="url(#riSkin)">
    <!-- horns -->
    <path d="M24.5 21.5c-3-3.5-4.5-7.5-3-10c2.7 1.4 5 5 5.8 8.6z"/>
    <path d="M39.5 21.5c3-3.5 4.5-7.5 3-10c-2.7 1.4-5 5-5.8 8.6z"/>
    <!-- ears -->
    <path d="M19.5 29.5 11 25.5 18.5 37.5z"/>
    <path d="M44.5 29.5 53 25.5 45.5 37.5z"/>
    <!-- head -->
    <path d="M32 19.5c9.5 0 15.5 6.5 15.5 14.2C47.5 41.6 40.8 47 32 47s-15.5-5.4-15.5-13.3C16.5 26 22.5 19.5 32 19.5z"/>
  </g>

  <!-- cheeks -->
  <g fill="#D9661A" fill-opacity="0.45">
    <ellipse cx="22.5" cy="38.5" rx="2.8" ry="1.8"/>
    <ellipse cx="41.5" cy="38.5" rx="2.8" ry="1.8"/>
  </g>

  <!-- eyes -->
  <g fill="#141A22">
    <ellipse cx="26.4" cy="32.6" rx="3.4" ry="3.8"/>
    <ellipse cx="37.6" cy="32.6" rx="3.4" ry="3.8"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.9">
    <circle cx="25.3" cy="31.2" r="1.2"/>
    <circle cx="36.5" cy="31.2" r="1.2"/>
  </g>

  <!-- grin, with one small fang -->
  <path d="M27 39.6q5 4.2 10 0" fill="none" stroke="#141A22" stroke-width="1.9" stroke-linecap="round"/>
  <path d="M30.2 41.7h2.6l-1.3 2.6z" fill="#FFFFFF"/>

  <!-- glass highlight -->
  <path d="M13.5 25.5A20 20 0 0 1 25 13.2" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3" stroke-linecap="round"/>
</svg>
