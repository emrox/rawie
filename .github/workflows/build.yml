name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # needed to attach builds to a release

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest      # WinUI 3 and MSIX packaging are Windows-only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Rawie.slnx

      - name: Build
        run: dotnet build Rawie.slnx -c Release --no-restore

      - name: Test
        run: dotnet run --project tests/Rawie.Tests -c Release --no-build

      # --- portable: self-contained, no install and no prerequisites ---
      - name: Publish portable
        run: >
          dotnet publish src/Rawie.App -c Release -r win-x64
          --self-contained true
          -p:WindowsAppSDKSelfContained=true
          -p:WindowsPackageType=None
          -o publish/portable

      - name: Zip portable
        run: Compress-Archive -Path publish/portable/* -DestinationPath Rawie-portable-win-x64.zip

      # --- MSIX: installable, uses the shared Windows App Runtime (much smaller) ---
      #
      # Windows only installs a signed MSIX. This signs with a certificate generated here, so the
      # artifact is installable once that certificate is trusted (see the .cer published alongside).
      # To use a real code-signing certificate instead, add it as a secret and point
      # PackageCertificateKeyFile at it — nothing else changes.
      - name: Create signing certificate
        shell: pwsh
        run: |
          # Subject must match Publisher in Package.appxmanifest, or signing is rejected.
          $cert = New-SelfSignedCertificate `
            -Type Custom -Subject "CN=Rawie" `
            -KeyUsage DigitalSignature -FriendlyName "Rawie CI" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $password = ConvertTo-SecureString -String "${{ github.run_id }}" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath signing.pfx -Password $password | Out-Null
          Export-Certificate  -Cert $cert -FilePath Rawie-signing-certificate.cer | Out-Null

      # Packaged unsigned, then signed with signtool: MSBuild's own signing can't import a
      # password-protected PFX (APPX0105/APPX0107) and silently leaves the package unsigned.
      - name: Build MSIX
        run: >
          dotnet build src/Rawie.App -c Release
          -p:Platform=x64
          -p:WindowsPackageType=MSIX
          -p:GenerateAppxPackageOnBuild=true
          -p:UapAppxPackageBuildMode=SideloadOnly
          -p:AppxBundle=Never
          -p:AppxPackageSigningEnabled=false
          -p:AppxPackageDir=${{ github.workspace }}\publish\msix\

      - name: Sign and collect MSIX
        shell: pwsh
        run: |
          # Only the app package — the folder also holds the runtime dependency packages.
          $msix = Get-ChildItem publish/msix -Recurse -Filter 'Rawie.App_*.msix' | Select-Object -First 1
          if (-not $msix) { throw "no .msix was produced" }

          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
                      Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /f signing.pfx /p "${{ github.run_id }}" $msix.FullName
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }

          Copy-Item $msix.FullName -Destination Rawie-installer-x64.msix
          "MSIX: {0:N1} MB" -f ($msix.Length / 1MB)

      - name: Remove signing key
        if: always()
        shell: pwsh
        run: Remove-Item signing.pfx -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: rawie-portable
          path: Rawie-portable-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: rawie-installer
          path: |
            Rawie-installer-x64.msix
            Rawie-signing-certificate.cer

      # --- tagging v* publishes a release with both builds attached ---
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          Rawie-portable-win-x64.zip
          Rawie-installer-x64.msix
          Rawie-signing-certificate.cer
          --title "Rawie ${{ github.ref_name }}"
          --generate-notes
