name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # needed to attach builds to a release

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest      # WinUI 3 and MSIX packaging are Windows-only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Rawie.slnx

      - name: Build
        run: dotnet build Rawie.slnx -c Release --no-restore

      - name: Test
        run: dotnet run --project tests/Rawie.Tests -c Release --no-build

      # --- portable: self-contained, no install and no prerequisites ---
      - name: Publish portable
        run: >
          dotnet publish src/Rawie.App -c Release -r win-x64
          --self-contained true
          -p:WindowsAppSDKSelfContained=true
          -p:WindowsPackageType=None
          -o publish/portable

      - name: Zip portable
        run: Compress-Archive -Path publish/portable/* -DestinationPath Rawie-portable-win-x64.zip

      # --- installer: a plain MSI, built from the same files as the portable build ---
      #
      # Deliberately not MSIX: Windows refuses to install an MSIX unless it is signed by a trusted
      # certificate, which makes it useless without a paid code-signing certificate. An MSI installs
      # unsigned. WiX is pinned to v5, which needs no licence acceptance step in CI.
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build installer
        run: >
          wix build installer/Rawie.wxs -arch x64 -ext WixToolset.UI.wixext
          -d PublishDir=${{ github.workspace }}\publish\portable
          -d AssetsDir=${{ github.workspace }}\assets
          -o Rawie-setup-x64.msi

      - uses: actions/upload-artifact@v4
        with:
          name: rawie-portable
          path: Rawie-portable-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: rawie-installer
          path: Rawie-setup-x64.msi

      # --- tagging v* publishes a release with both builds attached ---
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          Rawie-portable-win-x64.zip
          Rawie-setup-x64.msi
          --title "Rawie ${{ github.ref_name }}"
          --generate-notes
