name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

  # Called by release.yml so the release is built exactly the same way as every other build.
  workflow_call:
    inputs:
      version:
        description: Version stamped into the installer
        type: string
        default: '0.0.1'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest      # WinUI 3 and the installer are Windows-only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RAWimp.slnx

      - name: Build
        run: dotnet build RAWimp.slnx -c Release --no-restore

      - name: Test
        run: dotnet run --project tests/RAWimp.Tests -c Release --no-build

      # --- portable: self-contained, no install and no prerequisites ---
      - name: Publish portable
        run: >
          dotnet publish src/RAWimp.App -c Release -r win-x64
          --self-contained true
          -p:WindowsAppSDKSelfContained=true
          -p:WindowsPackageType=None
          -o publish/portable

      - name: Zip portable
        run: Compress-Archive -Path publish/portable/* -DestinationPath RAWimp-portable-win-x64.zip

      # --- installer: a plain MSI, built from the same files as the portable build ---
      #
      # Deliberately not MSIX: Windows refuses to install an MSIX unless it is signed by a trusted
      # certificate, which makes it useless without a paid code-signing certificate. An MSI installs
      # unsigned. WiX is pinned to v5, which needs no licence acceptance step in CI.
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build installer
        run: >
          wix build installer/RAWimp.wxs -arch x64 -ext WixToolset.UI.wixext
          -d Version=${{ inputs.version || '0.0.1' }}
          -d PublishDir=${{ github.workspace }}\publish\portable
          -d AssetsDir=${{ github.workspace }}\assets
          -o RAWimp-setup-x64.msi

      - uses: actions/upload-artifact@v4
        with:
          name: rawimp-portable
          path: RAWimp-portable-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: rawimp-installer
          path: RAWimp-setup-x64.msi
